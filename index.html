hdMTKELcZQ2vyUwZMcBCEBubWQLuCEKh2DlInshCCM/uhCFB//Z" alt="麥子的肖像"><span class="attribute" contenteditable="true">焦糖棕</span></div><div class="abilities"><div class="passive"><b contenteditable="true">睡覺睡到飽</b><br><span contenteditable="true">全年無休</span></div><div class="move"><small>招式</small><span contenteditable="true">zzzzZZZZZ</span></div><div class="move"><small>奧義</small><span contenteditable="true">zzzzZZZZZ zzzzZZZZZ</span></div></div><div class="stats"><div><span>弱點</span><b contenteditable="true">出門看醫生</b></div><div><span>抗性</span><b contenteditable="true">閃避技能+100</b></div><div><span>調度成本</span><b contenteditable="true">無法調度!</b></div></div><div class="footer"><span contenteditable="true">Illus. 貓星研究院</span><span contenteditable="true">SSR · 2026</span></div></div><div class="grain"></div><div class="foil"></div><div class="glare"></div></article><article class="face back" id="back" aria-hidden="true"><div class="seal"><span contenteditable="true">貓星研究院</span><strong contenteditable="true">麥子</strong><span contenteditable="true">SSR · 2026</span></div><div class="foil"></div><div class="glare"></div></article></div></div></div><div class="hint">移動游標或拖曳卡牌，探索黑金光澤</div></section><section class="intro"><div class="eyebrow">GOLD ULTRA · SSR</div><h1>麥子的傳奇時刻</h1><p>焦糖棕的溫柔，黑金色的光芒。<br>喵星董事，全年無休地睡覺睡到飽。</p><div class="panel"><label for="style">卡牌風格</label><select id="style"><option value="gold">Gold Ultra · 黑金浮雕</option><option value="cosmos">Cosmos Holo · 宇宙彩虹</option><option value="rainbow">Rainbow Secret · 極光全息</option><option value="silver">Silver Phantom · 冷冽銀鏡</option></select><div class="buttons"><button id="flip" aria-pressed="false">翻至卡背 ↻</button><button id="gyro" style="grid-column:1/-1">啟用裝置傾斜</button></div><button class="export" id="export">下載高解析 PNG ↓</button><p class="note">點選卡面文字即可編輯。文字修改只保留於本次瀏覽。</p><div class="status" id="status" role="status" aria-live="polite"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script>
const card=document.querySelector('#card'),stage=document.querySelector('#stage'),status=document.querySelector('#status');let flipped=false,gyroEnabled=false,dragging=false;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tilt(x,y){if(reduced)return;card.style.setProperty('--rx',((.5-y)*20)+'deg');card.style.setProperty('--ry',((x-.5)*24)+'deg');card.style.setProperty('--px',(x*100)+'%');card.style.setProperty('--py',(y*100)+'%')}
function reset(){card.classList.remove('tracking');tilt(.5,.5)}stage.addEventListener('pointerdown',e=>{if(e.target.closest('[contenteditable]'))return;if(e.pointerType!=='mouse'){dragging=true;stage.setPointerCapture(e.pointerId)}});stage.addEventListener('pointermove',e=>{if(e.target.closest('[contenteditable]')||e.pointerType!=='mouse'&&!dragging)return;const r=stage.getBoundingClientRect();card.classList.add('tracking');tilt(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height)))});stage.addEventListener('pointerleave',()=>{if(!dragging)reset()});stage.addEventListener('pointerup',()=>{dragging=false;reset()});stage.addEventListener('pointercancel',()=>{dragging=false;reset()});
document.querySelector('#style').addEventListener('change',e=>card.dataset.style=e.target.value);document.querySelector('#flip').addEventListener('click',e=>{flipped=!flipped;card.classList.toggle('flipped',flipped);e.currentTarget.setAttribute('aria-pressed',flipped);e.currentTarget.textContent=flipped?'翻至卡面 ↻':'翻至卡背 ↻';document.querySelector('#front').inert=flipped;document.querySelector('#back').inert=!flipped;document.querySelector('#front').setAttribute('aria-hidden',flipped);document.querySelector('#back').setAttribute('aria-hidden',!flipped)});document.querySelector('#back').inert=true;

function orient(e){if(!gyroEnabled||dragging||e.gamma===null||e.beta===null)return;tilt(Math.max(0,Math.min(1,.5+e.gamma/60)),Math.max(0,Math.min(1,.5+(e.beta-35)/80)))}document.querySelector('#gyro').addEventListener('click',async e=>{if(gyroEnabled){gyroEnabled=false;window.removeEventListener('deviceorientation',orient);reset();e.target.textContent='啟用裝置傾斜';return}try{if(!window.DeviceOrientationEvent){status.textContent='此裝置不支援傾斜感應。';return}if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted'){status.textContent='未取得裝置傾斜權限。';return}gyroEnabled=true;window.addEventListener('deviceorientation',orient);e.target.textContent='關閉裝置傾斜';status.textContent='傾斜感應已啟用；需支援感應器的裝置與 HTTPS。'}catch(error){status.textContent='無法啟用感應，請在 HTTPS 網頁上重試。'}});
document.querySelectorAll('[contenteditable]').forEach(el=>el.addEventListener('paste',e=>{e.preventDefault();const text=e.clipboardData.getData('text/plain');const s=window.getSelection();if(!s.rangeCount)return;const r=s.getRangeAt(0);r.deleteContents();const n=document.createTextNode(text);r.insertNode(n);r.setStartAfter(n);r.collapse(true);s.removeAllRanges();s.addRange(r)}));
document.querySelector('#export').addEventListener('click',async e=>{const btn=e.currentTarget;btn.disabled=true;status.textContent='正在製作高解析圖片…';try{if(!window.html2canvas)throw new Error('下載元件尚未載入，請確認網路連線後重新整理。');await document.querySelector('#portrait').decode();await document.fonts.ready;const face=document.querySelector(flipped?'#back':'#front');const canvas=await html2canvas(face,{scale:3,backgroundColor:null,useCORS:true,onclone:doc=>{const c=doc.querySelector('#card');c.classList.add('exporting');c.classList.remove('flipped');doc.querySelector('#back').style.transform='none';doc.querySelector('#front').style.transform='none';const other=doc.querySelector(flipped?'#front':'#back');other.style.display='none';}});const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw new Error('匯出失敗，請重試。');const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='麥子-SSR-'+(flipped?'卡背':'卡面')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);status.textContent='PNG 已下載。'}catch(error){status.textContent=error.message||'匯出失敗，請重試。'}finally{btn.disabled=false}});
</script></body></html>
